# Supabase CLI configuration (docs/DEPLOYMENT.md). Only what the project
# needs is set here; everything else keeps the CLI defaults.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "anglais"

[functions.ai]
enabled = true
# The function verifies the user's JWT itself (signature against the
# project's keys, issuer, audience), then the allowed e-mail (D-062). The
# platform check is off: it also accepts the public publishable key, so it
# adds no protection, and it can block the browser's CORS preflight.
verify_jwt = false
entrypoint = "./functions/ai/index.ts"
# Also resolves the imports of ../_shared (D-061).
import_map = "./functions/ai/deno.json"
